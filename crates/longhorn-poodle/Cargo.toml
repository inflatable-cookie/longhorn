[package]
name = "longhorn-poodle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
longhorn-config.workspace = true
longhorn-core.workspace = true
longhorn-licence.workspace = true
longhorn-notifications.workspace = true
longhorn-operation.workspace = true
longhorn-settings.workspace = true
longhorn-update.workspace = true
semver.workspace = true
# Git ref, not a path. Poodle's Rust crates are `publish = false` and travel by
# tag, so this is how a consumer takes them. The path ref this replaces escaped
# the repository — `../../../poodle` resolves only on a machine that happens to
# have Poodle checked out beside Longhorn, so `cargo metadata` failed on the
# first clean checkout and took all fifty workspace members down with it.
#
# To edit Poodle and Longhorn together, override locally rather than reverting
# this line — `[patch."https://github.com/inflatable-cookie/poodle"]` in a
# `.cargo/config.toml` that is not committed.
poodle-specs = { version = "0.2.2", git = "https://github.com/inflatable-cookie/poodle.git", tag = "v0.2.2" }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
