# Stages a verified update and replaces the running application. Card 190 step 2:
# authorizing an install is not covered by permission to look for one, so this
# is never bundled with check. The two commands sit together because the
# staging half replaces nothing and the apply half consumes only what prepare
# verified; a host that wants to grant them separately can split this file.
[[permission]]
identifier = "allow-longhorn-update-install"
description = "Allows Longhorn to stage a verified update and replace the application with it."
commands.allow = [
  "longhorn_update_prepare",
  "longhorn_update_apply",
]
