[package]
name = "longhorn-agent-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-agnostic core of the Longhorn agent app-control surface (contract 022)"
publish = false

[features]
# Off by default. The `evaluate` MCP tool stays listed so a packaged
# `agent-control` build answers typed `Unsupported`; this feature is what
# compiles the JS escape hatch (contract 022; expected only in dev/test).
agent-control-evaluate = []
# g02.044: the stdio carrier is opt-in. A build without `client` contains
# none of it: no binary target (see `[[bin]]` below) and no HTTP client in
# the graph.
# `tokio/process` is for the end-to-end test only: it spawns the built
# binary as a child harness would. `tokio/io-std` is the carrier's stdio.
client = ["dep:reqwest", "tokio/io-std", "tokio/process"]

[dependencies]
axum.workspace = true
base64.workspace = true
getrandom.workspace = true
longhorn-config.workspace = true
longhorn-core.workspace = true
reqwest = { workspace = true, optional = true }
rmcp.workspace = true
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tokio.workspace = true

[[bin]]
name = "longhorn-agent-control-client"
path = "src/bin/longhorn-agent-control-client.rs"
required-features = ["client"]

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
