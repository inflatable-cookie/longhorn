[package]
name = "longhorn-tauri-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
longhorn-bridge.workspace = true
longhorn-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# `unstable` because caller admission and event delivery must survive
# multiwebview windows: `WebviewWindow` and `get_webview_window` refuse a window
# hosting a child webview (a native-content island).
tauri = { workspace = true, features = ["unstable"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
