[package]
name = "longhorn-tool-provision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Verified artifact release and install pipelines for managed command-line tools (contract 027)"
publish = false

[features]
# Test support, off by default: a loopback HTTP server that serves recorded
# release fixtures at the production URL shapes, and the loopback endpoint
# constructor that points the release source at it. Adds no dependencies.
fixture-server = []

[dependencies]
flate2.workspace = true
fs4.workspace = true
hex.workspace = true
longhorn-archive-path.workspace = true
longhorn-redact.workspace = true
longhorn-support-log.workspace = true
# Blocking client for the host's blocking executor (contract 027, part 4b),
# with rustls for https. Default features stay off: no gzip (the bounds count
# the bytes the server sent), no system proxy, no cookies, no charset.
reqwest = { workspace = true, features = ["blocking", "rustls"] }
secrecy.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
zip.workspace = true

[dev-dependencies]
flate2.workspace = true
tar.workspace = true
zip.workspace = true

[lints]
workspace = true
