[[permission]]
identifier = "allow-longhorn-history-tree-read"
description = "Allows checked Longhorn fork-history summary, path, branch, and continuation reads."
commands.allow = [
  "longhorn_history_tree_snapshot",
  "longhorn_history_tree_path",
  "longhorn_history_tree_branches",
  "longhorn_history_tree_continuations",
]
