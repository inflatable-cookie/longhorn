[catalog]
alias = "longhorn"

[bootstrap]
setup = [{ task = "bootstrap:deps" }]

[manifest]
include = ["config/release.toml"]

[tasks]
"bootstrap:deps" = "bun install --frozen-lockfile"

# One task per job, not one per package. Per-package variants were hundreds of
# lines of duplication that nothing ever invoked individually; loops and test
# runners cover the same ground.

# --- Rust ---------------------------------------------------------------
# `cargo fmt --all` is not workspace-scoped the way `--workspace` is: it walks
# every *local* package in the graph, so a relative path dependency drags a
# sibling repository in and reformats it under this workspace's style edition.
# Longhorn is edition 2024 and Poodle is 2021, so `poodle-specs` failed here
# while passing its own gate. The package list comes from `--no-deps`, which
# is genuinely members-only.
"fmt:rust" = "sh -c 'exec cargo fmt --check $(cargo metadata --no-deps --format-version 1 | jq -r .packages[].name | sed s/^/-p/)'"
"lint:rust" = "cargo clippy --workspace --all-targets --locked -- -D warnings"
"lint:agent-tool-dispatch" = "cargo clippy -p longhorn-agent-tool-dispatch --all-targets --locked -- -D warnings"
# Second pass: default features leave bindings/supervision/operation and the
# proof examples' surface-mode code uncompiled, so `lint:rust` cannot see them.
"lint:rust:features" = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"
"test:rust" = "cargo test --workspace --locked"
"test:agent-tool-dispatch" = "cargo test -p longhorn-agent-tool-dispatch --locked"
# `effigy test` (the built-in) plans `cargo nextest run`, which skips doc
# tests. The gate runner is this task — `cargo test` — because the doc tests
# are part of the claim. The built-in remains a convenience for iteration.
"docs:rust" = "sh -c 'RUSTDOCFLAGS=\"-D warnings\" exec cargo doc --workspace --no-deps --locked'"
"docs:agent-tool-dispatch" = "sh -c 'RUSTDOCFLAGS=\"-D warnings\" exec cargo doc -p longhorn-agent-tool-dispatch --no-deps --locked'"

# Prototypes are separate workspaces, so no selector above touches them. They
# are the only artefacts binding a Longhorn seam to a real host SDK, and until
# this existed the one proving the GPUI seam was the one thing nothing built —
# it was broken by a signature change and caught by a hand-run.
#
# `check` rather than `build`: the failure mode is API drift, which type
# checking catches, and `gpui` alone is 757 packages and 3.3 GiB of artifacts
# once linked. Deliberately absent from `qa`; wired into the release gates
# instead, because "the host seam still matches its SDK" is a claim that must
# hold before a tag rather than before every commit.
"check:prototypes" = "sh -c 'for d in prototypes/*/; do (cd \"$d\" && cargo check --all-targets --locked) || exit 1; done'"
# Pre-gate only: refresh excluded prototype locks (and the root lock) after a
# Longhorn version bump. Does not replace or weaken check:prototypes --locked.
"sync:prototype-locks" = "bun scripts/sync-prototype-locks.ts"
# Coordinated version bump. Takes X.Y.Z after `--`. Does not tag or publish.
"release:bump" = { rhai = "scripts/release-bump.rhai" }
"check:release-gates" = "bun scripts/check-release-gates-alignment.ts"
"test:release-tooling" = "bun test scripts/longhorn-version.test.ts scripts/release-bump.test.ts scripts/check-release-gates-alignment.test.ts"

# --- TypeScript and Svelte ----------------------------------------------
"check:bun-deps" = "bun scripts/check-bun-deps.ts"
"check:ts" = [
  { task = "check:bun-deps" },
  "sh -c 'for c in packages/*/tsconfig.json; do bun x tsc -p \"$c\" || exit 1; done'",
]
"check:svelte" = [
  { task = "check:bun-deps" },
  "bun x svelte-check --tsconfig packages/longhorn-poodle-svelte/tsconfig.json",
]
"check:packages" = "sh -c 'for d in packages/*/; do (cd \"$d\" && bun pm pack --dry-run --ignore-scripts >/dev/null) || exit 1; done'"
"test:ts" = "bash scripts/test-packages.sh"
"test:vitest" = "sh -c 'for c in packages/*/vitest.config.ts; do bun x vitest run --config \"$c\" || exit 1; done'"

# --- Generated protocol bindings ----------------------------------------
"check:bindings" = "sh -c 'for d in bridge commands config history history-tree layout licence native-content notifications operation settings surfaces surface-transfer transfer update; do cargo run -q -p longhorn-bindings -- \"$d\" check || exit 1; done'"
"generate:bindings" = "sh -c 'for d in bridge commands config history history-tree layout licence native-content notifications operation settings surfaces surface-transfer transfer update; do cargo run -q -p longhorn-bindings -- \"$d\" write || exit 1; done'"
"check:api-reference" = "bun scripts/generate-api-reference-card126.ts"
"check:tauri-seam-strings" = "bun scripts/verify-tauri-seam-strings.ts"
"check:consumer-isolation" = "bun scripts/verify-consumer-isolation.ts"
"check:repo-containment" = "bun scripts/verify-repo-containment.ts"
# g02.026 stage 1: report the machine's bun global-link state and fail when a
# dependency resolves through a link that leaves the repository. A registered
# link that nothing resolves through is reported, not failed -- poisoning
# requires an active resolution.
"check:bun-links" = "bun scripts/check-bun-links.ts"
"check:runner-tools" = "bun scripts/check-runner-tools.ts"
# The native Tauri injection bundle must remain generated from the TypeScript
# entrypoint and shim. `--write` refreshes it after source edits.
"check:agent-control-shim" = "bun scripts/agent-control-shim.ts"
"generate:agent-control-shim" = "bun scripts/agent-control-shim.ts --write"
# Contract 022's release-absence claim, both directions: feature-off release
# artifacts carry no control-surface code and no core-crate graph edge, with
# the feature-on pass as the scan's own positive control. In `qa`, which the
# release `workspace` gate runs — no separate release.gates line, per the
# single-table rule in config/release.toml.
"check:agent-control-release-absence" = "bun scripts/verify-agent-control-release-absence.ts"
"check:agent-tool-dispatch-release-absence" = "bun scripts/verify-agent-tool-dispatch-release-absence.ts"
"check:agent-tool-dispatch" = [
  { task = "lint:agent-tool-dispatch" },
  { task = "test:agent-tool-dispatch" },
  { task = "docs:agent-tool-dispatch" },
  { task = "check:agent-tool-dispatch-release-absence" },
  { task = "check:api-reference" },
]
"proof:agent-tool-dispatch-source-consumer" = "bun scripts/verify-agent-tool-dispatch-source-consumer.ts"
# Card 236: lock the skill's tool table to CONTROL_TOOL_NAMES and the
# workspace version; also runs finder and install fixtures (Cards 235-236).
"check:agent-control-skill" = "bun scripts/verify-agent-control-skill.ts"
"agent-control:install-skill" = { rhai = "scripts/install-agent-control-skill.rhai" }
"generate:api-reference" = "bun scripts/generate-api-reference-card126.ts --write"

# --- Artifact proofs ----------------------------------------------------
# Each script builds isolated artifacts and asserts one composition claim.
# Every proof installs Poodle from the registry. The linked-Poodle exemption
# that used to be forced here is gone (Card 218 step 5): it existed because
# published poodle-svelte 0.1.0 shipped none of the SettingsShell,
# UpdateCenter and UpdateStatus components the adapter imports, and 0.2.2
# ships all three.
#
# `pack-typecheck` is the Card 218 remainder: the packed adapter typechecked
# against a bare stage whose only Poodle source is the registry, proving the
# published peer range resolves from npm.
"proof:artifacts" = "sh -c 'for s in app-shell-proof bridge-topology-conformance bridge-topology-artifacts settings-composition-proof command-system-artifacts history-system-artifacts history-tree-artifacts operation-notification-artifacts native-content-artifacts poodle-preview greenfield-card125 guides-card126 documented-commands pack-typecheck; do echo \"proof $s\"; bun \"scripts/verify-$s.ts\" >/dev/null || exit 1; done'"
"proof:pack-typecheck" = "bun scripts/verify-pack-typecheck.ts"

# Pre-release rehearsal of the five machine properties that made local qa green
# while the first release.yml runs failed. Not part of qa — minutes, not seconds.
"ci:rehearse" = "bash scripts/ci-rehearse.sh"

# --- Release ------------------------------------------------------------
"release:floor" = "bash scripts/check-release-floor.sh"
"release:source-consumer" = "bash scripts/verify-source-consumer.sh"
# `[release.gates]` minus `workspace`, declaration order. `check:release-gates`
# fails if this list drifts. The runner still runs `effigy qa` separately.
"release:gates" = [
  "bun scripts/verify-private-candidate-docs-card127.ts",
  "cargo deny check advisories",
  { task = "docs:rust" },
  { task = "check:prototypes" },
  { task = "release:floor" },
  { task = "release:source-consumer" },
]

# --- Documentation ------------------------------------------------------
"qa:docs:catalog-links" = "effigy docs check links"
"qa:docs:links" = "effigy docs check links README.md AGENTS.md docs/README.md docs/plan.md docs/knowledge/README.md docs/knowledge/architecture/README.md docs/knowledge/contracts/README.md docs/guides/README.md docs/guides/getting-started.md docs/reference/README.md"
"qa:docs:agent-defaults" = "effigy docs check forbidden AGENTS.md README.md docs/README.md --forbid '--repo .'"
# Backticked paths in the orientation files and every knowledge file must exist.
"qa:docs:paths" = "sh -c 'exec effigy docs check paths README.md AGENTS.md scripts/README.md docs/README.md docs/plan.md docs/knowledge/*.md docs/knowledge/architecture/*.md docs/knowledge/contracts/*.md'"
"qa:docs" = [
  { task = "qa:docs:links" },
  { task = "qa:docs:agent-defaults" },
  { task = "qa:docs:paths" },
  { task = "qa:docs:catalog-links" },
  { task = "held-surface" },
  { task = "host-protocol" },
]
"held-surface" = "bun scripts/verify-held-surface.ts"
"host-protocol" = "bun scripts/verify-host-protocol.ts"

# --- Aggregates ---------------------------------------------------------
# Cheap orientation baseline for `effigy doctor`, which AGENTS.md names as a
# first command. Mapping health→qa made every doctor run launch the Rust/TS
# board before an agent had picked a bounded task; mapping
# it to `release:floor` was the same mistake wearing a smaller name, because
# the floor is two Clippy passes plus the full test suite on the MSRV
# toolchain. Both are minutes. Orientation has to be seconds or nobody runs it.
#
# What belongs here: checks that answer "is this tree coherent right now"
# without compiling it. Formatting drift and a missing runner tool are exactly
# that -- and runner-tools is the guard against the class that killed release
# run 6, so having it fire early is worth more than having it fire late.
# The floor stays where it earns its cost: a release gate.
health = [
  { task = "fmt:rust" },
  { task = "check:runner-tools" },
  { task = "check:release-gates" },
  { task = "check:agent-control-skill" },
]
qa = [
  { task = "fmt:rust" },
  { task = "check:runner-tools" },
  { task = "check:release-gates" },
  { task = "bootstrap:deps" },
  { task = "lint:rust" },
  { task = "lint:rust:features" },
  { task = "test:rust" },
  { task = "check:ts" },
  { task = "check:svelte" },
  { task = "check:packages" },
  { task = "test:ts" },
  { task = "test:vitest" },
  { task = "test:release-tooling" },
  { task = "check:bindings" },
  { task = "check:api-reference" },
  { task = "check:tauri-seam-strings" },
  { task = "check:consumer-isolation" },
  { task = "check:repo-containment" },
  { task = "check:agent-control-release-absence" },
  { task = "check:agent-control-shim" },
  { task = "check:agent-tool-dispatch-release-absence" },
  { task = "check:agent-control-skill" },
  { task = "proof:artifacts" },
  { task = "qa:docs" },
]

# --- Doctor scan calibration (Card 223) -----------------------------------
# Doctor's built-in scans previously ran on stock defaults that were never
# calibrated to this repo. Each setting below is the triaged posture, with
# the reason written down here instead of absorbed as red.

[scan.god_files]
# Contract suites, proof scripts, and prototype adapters accumulate
# assertions linearly -- a line cap there measures length, not entanglement,
# and splitting them buys nothing. Shipped source keeps a real guard: a
# `src/` file over 700 code lines still errors, over 400 stays a visible
# warning. Today's largest source file is 582 code lines
# (longhorn-gpui-windowing/src/lifecycle.rs).
warn = 400
high = 700
critical = 1000
exclude = ["crates/*/tests/**", "prototypes/**", "scripts/**", "examples/**"]

[scan.generated_in_src]
# ts-rs output is committed under packages/*/src/**/generated/ by design --
# `check:bindings` gates drift byte-for-byte, so doctor re-flagging it is
# noise. crates/*/bindings/ holds the per-type files ts-rs's `#[ts(export)]`
# emits for the conformance suites -- equally intentional. And the generator
# itself trips the content marker because it *writes* the marker;
# longhorn-bindings/src is the one place allowed to.
exclude = [
  "packages/*/src/**/generated/**",
  "crates/*/bindings/**",
  "crates/longhorn-bindings/src/**",
]

[scan.attention_markers]
# Matching is case-insensitive substring, so "SECURITY" matched the prose
# "...security release is never withheld..." in update/src/decision.rs:142.
# A repo that ships a security-release policy will always say "security" in
# sentences; the scanner cannot express marker syntax, so the word leaves
# the critical list. The rest of the stock lists stand.
warning = ["TODO", "REVIEW", "NOTE", "placeholder"]
high = ["FIXME", "HACK", "@deprecated", "workaround"]
critical = ["BUG", "remove before release"]

# Release gates live in `config/release.toml`, next to the rest of `[release]`.
# Declaring a second `[release.gates]` here merges rather than conflicts, which
# is how the Rust board came to run twice per release -- once directly and once
# through `effigy qa`. One table, one home.
