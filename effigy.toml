"build:native-content-backing-surface-production-proof" = "sh -c 'cd examples/tauri-native-content-backing-surface-proof/src-tauri && exec cargo +1.85.0 tauri build --bundles app --ci'"
"verify:native-content-backing-surface-production-proof" = '''sh -c 'jq -e '.\''outcome == "pass_with_unmet_environment_claims" and (.checks | length == 11) and ([.checks[] | select(.status == "pass")] | length == 10) and ([.checks[] | select(.status == "unmet") | .id] == ["available_native_scale_transition"])'\'' examples/tauri-native-content-backing-surface-proof/evidence/runs/2026-08-01-macos-arm64/final-report.json >/dev/null && jq -e '.\''packaged_run.outcome == "pass_with_unmet_environment_claims" and .packaged_run.passed_checks == 10 and .native_boundary.adapter_raw_pointer_exports == false and all(.forbidden_edges[]; . == false)'\'' examples/tauri-native-content-backing-surface-proof/evidence/inventory.json >/dev/null && jq -e '.\''targets.macos.status == "packaged-proof-pass-with-native-scale-transition-unmet" and .targets.windows.status == "unsupported" and .targets.linux.status == "unsupported"'\'' examples/tauri-native-content-backing-surface-proof/evidence/target-support.json >/dev/null && ! rg -n '\''fixture_error|proof_failed'\'' examples/tauri-native-content-backing-surface-proof/evidence/runs/2026-08-01-macos-arm64/runtime-transcript.jsonl' '''
