[catalog]
alias = "longhorn"

[docs_policy.indexes.vision]
file = "docs/vision/README.md"
dir = "docs/vision"
section = "Vision Artifacts"
exclude = ["history/**"]

[tasks]
health = [{ task = "qa" }]
"fmt:rust" = "cargo fmt --all --check"
"lint:rust" = "cargo clippy --workspace --all-targets -- -D warnings"
"test:rust" = "cargo test --workspace"
"lint:native-content" = "cargo clippy -p longhorn-native-content --all-targets --features bindings -- -D warnings"
"test:native-content" = "cargo test -p longhorn-native-content --features bindings"
"generate:native-content" = "cargo run -p longhorn-bindings -- native-content write"
"check:native-content-bindings" = "cargo run -p longhorn-bindings -- native-content check"
"check:native-content-ts" = "bun x tsc -p packages/native-content/tsconfig.json"
"test:native-content-ts" = "bun test packages/native-content/tests/*.test.ts"
"check:native-content-package" = "sh -c 'cd packages/native-content && exec bun pm pack --dry-run --ignore-scripts'"
"qa:native-content" = [
  { task = "lint:native-content" },
  { task = "test:native-content" },
  { task = "check:native-content-bindings" },
  { task = "check:native-content-ts" },
  { task = "test:native-content-ts" },
  { task = "check:native-content-package" },
  { task = "qa:native-content-svelte" },
  { task = "check:native-content-child-view-graph" },
  { task = "check:native-content-isolated-window-production-graph" },
  { task = "check:native-content-backing-surface-production-graph" },
  { task = "verify:native-content-child-view-proof" },
  { task = "verify:native-content-isolated-window-proof" },
  { task = "verify:native-content-backing-surface-production-proof" },
]
"check:native-content-svelte-ts" = "bun x tsc -p packages/native-content-svelte/tsconfig.json"
"check:native-content-svelte" = "bun x svelte-check --tsconfig packages/native-content-svelte/tsconfig.json"
"test:native-content-svelte" = "bun x vitest run --config packages/native-content-svelte/vitest.config.ts"
"check:native-content-svelte-package" = "sh -c 'cd packages/native-content-svelte && exec bun pm pack --dry-run --ignore-scripts'"
"qa:native-content-svelte" = [
  { task = "check:native-content-svelte-ts" },
  { task = "check:native-content-svelte" },
  { task = "test:native-content-svelte" },
  { task = "check:native-content-svelte-package" },
]
"fmt:native-content-child-view" = "cargo fmt --all --check"
"lint:native-content-child-view" = "cargo clippy -p longhorn-tauri-native-content-child-view --all-targets -- -D warnings"
"test:native-content-child-view" = "cargo +1.85.0 test -p longhorn-tauri-native-content-child-view"
"check:native-content-child-view" = "cargo +1.85.0 check -p longhorn-tauri-native-content-child-view"
"check:native-content-child-view-graph" = '''sh -c '! cargo tree -p longhorn-tauri-native-content-child-view --edges normal --prefix none | rg "longhorn-native-content-isolated|longhorn-native-content-backing|wgpu|svelte|poodle|plugin"' '''
"qa:native-content-child-view" = [
  { task = "fmt:native-content-child-view" },
  { task = "lint:native-content-child-view" },
  { task = "test:native-content-child-view" },
  { task = "check:native-content-child-view" },
  { task = "check:native-content-child-view-graph" },
]
"check:native-content-child-view-proof" = "cargo +1.85.0 check -p longhorn-native-content-child-view-proof"
"build:native-content-child-view-proof" = "sh -c 'cd examples/tauri-native-content-child-view-proof/src-tauri && exec cargo +1.85.0 tauri build --bundles app --ci'"
"verify:native-content-child-view-proof" = '''sh -c 'jq -e '.\''outcome == "pass_with_unmet_environment_claims" and ([.checks[] | select(.status == "pass")] | length == 7) and ([.checks[] | select(.status == "observed_unknown") | .id] == ["focus_and_visibility_observation_remain_unknown"]) and ([.checks[] | select(.status == "unmet") | .id] == ["native_scale_switch"])'\'' examples/tauri-native-content-child-view-proof/evidence/runs/2026-07-31-macos-arm64/final-report.json >/dev/null && jq -e '.\''packaged_run.outcome == "pass_with_unmet_environment_claims" and .packaged_run.passed_checks == 7 and .native_boundary.raw_webview_export == false and all(.forbidden_edges[]; . == false)'\'' examples/tauri-native-content-child-view-proof/evidence/inventory.json >/dev/null && jq -e '.\''targets.macos.status == "packaged-proof-pass-with-native-scale-switch-unmet" and .targets.windows.status == "unproved" and .targets.linux.status == "unproved"'\'' examples/tauri-native-content-child-view-proof/evidence/target-support.json >/dev/null && ! rg -n '\''fixture_error|proof_failed'\'' examples/tauri-native-content-child-view-proof/evidence/runs/2026-07-31-macos-arm64/runtime-transcript.jsonl' '''
"qa:native-content-child-view-proof" = [
  { task = "check:native-content-child-view-proof" },
  { task = "verify:native-content-child-view-proof" },
]
"fmt:native-content-isolated-window-production" = "cargo fmt --all --check"
"lint:native-content-isolated-window-production" = "cargo clippy -p longhorn-native-content-isolated-window --all-targets -- -D warnings"
"test:native-content-isolated-window-production" = "cargo +1.85.0 test -p longhorn-native-content-isolated-window"
"check:native-content-isolated-window-production" = "cargo +1.85.0 check -p longhorn-native-content-isolated-window"
"check:native-content-isolated-window-production-graph" = '''sh -c '! cargo tree -p longhorn-native-content-isolated-window --edges normal --prefix none | rg "tauri|prototype|plugin|wgpu|svelte|poodle|child.view|backing.surface"' '''
"qa:native-content-isolated-window-production" = [
  { task = "fmt:native-content-isolated-window-production" },
  { task = "lint:native-content-isolated-window-production" },
  { task = "test:native-content-isolated-window-production" },
  { task = "check:native-content-isolated-window-production" },
  { task = "check:native-content-isolated-window-production-graph" },
]
"check:native-content-isolated-window-proof" = "cargo +1.85.0 check -p longhorn-native-content-isolated-window-proof"
"build:native-content-isolated-window-proof" = "sh -c 'cd examples/tauri-native-content-isolated-window-proof/src-tauri && exec cargo +1.85.0 tauri build --bundles app --ci'"
"verify:native-content-isolated-window-proof" = '''sh -c 'jq -e '.\''outcome == "pass" and ([.checks[] | select(.status == "pass")] | length == 11) and ([.checks[] | select(.status != "pass")] | length == 0)'\'' examples/tauri-native-content-isolated-window-proof/evidence/runs/2026-08-01-macos-arm64/final-report.json >/dev/null && jq -e '.\''packaged_run.outcome == "pass" and .packaged_run.passed_checks == 11 and .native_boundary.raw_pointer_exports == false and .outer_placement.adapter_position_operations == false and all(.forbidden_edges[]; . == false)'\'' examples/tauri-native-content-isolated-window-proof/evidence/inventory.json >/dev/null && jq -e '.\''targets.macos.status == "packaged-proof-pass" and .targets.windows.status == "unsupported" and .targets.linux.status == "unsupported"'\'' examples/tauri-native-content-isolated-window-proof/evidence/target-support.json >/dev/null && ! rg -n '\''fixture_error|proof_failed'\'' examples/tauri-native-content-isolated-window-proof/evidence/runs/2026-08-01-macos-arm64/runtime-transcript.jsonl' '''
"qa:native-content-isolated-window-proof" = [
  { task = "check:native-content-isolated-window-proof" },
  { task = "verify:native-content-isolated-window-proof" },
]
"fmt:native-content-backing-surface-production" = "cargo fmt --all --check"
"lint:native-content-backing-surface-production" = "cargo clippy -p longhorn-native-content-backing-surface --all-targets -- -D warnings"
"test:native-content-backing-surface-production" = "cargo +1.85.0 test -p longhorn-native-content-backing-surface"
"check:native-content-backing-surface-production" = "cargo +1.85.0 check -p longhorn-native-content-backing-surface"
