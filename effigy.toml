"check:native-content-isolated-window-production-graph" = '''sh -c '! cargo tree -p longhorn-native-content-isolated-window --edges normal --prefix none | rg "tauri|prototype|plugin|wgpu|svelte|poodle|child.view|backing.surface"' '''
"qa:native-content-isolated-window-production" = [
