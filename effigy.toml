[catalog]
alias = "longhorn"

[docs_policy.indexes.vision]
file = "docs/vision/README.md"
dir = "docs/vision"
section = "Vision Artifacts"
exclude = ["history/**"]

[tasks]
health = [{ task = "qa" }]
"fmt:rust" = "cargo fmt --all --check"
"lint:rust" = "cargo clippy --workspace --all-targets -- -D warnings"
"test:rust" = "cargo test --workspace"
"check:core-ts" = "bun x tsc -p packages/core/tsconfig.json"
"check:surfaces-ts" = "bun x tsc -p packages/surfaces/tsconfig.json"
"check:transfer-ts" = "bun x tsc -p packages/transfer/tsconfig.json"
"check:surface-transfer-ts" = "bun x tsc -p packages/surface-transfer/tsconfig.json"
"check:tauri-ts" = "bun x tsc -p packages/tauri/tsconfig.json"
"check:svelte-ts" = "bun x tsc -p packages/svelte/tsconfig.json"
"check:svelte-runes" = "bun x svelte-check --tsconfig packages/svelte/tsconfig.json"
"verify:poodle-preview" = "bun scripts/verify-poodle-preview.ts"
"check:poodle-ts" = "bun x tsc -p packages/poodle/tsconfig.json"
"check:poodle-svelte" = "bun x svelte-check --tsconfig packages/poodle/tsconfig.json"
"test:poodle" = "bun x vitest run --config packages/poodle/vitest.config.ts"
"check:poodle-package" = "sh -c 'cd packages/poodle && exec bun pm pack --dry-run --ignore-scripts'"
"check:client-ts" = [
  { task = "check:core-ts" },
  { task = "check:surfaces-ts" },
  { task = "check:transfer-ts" },
  { task = "check:surface-transfer-ts" },
  { task = "check:tauri-ts" },
  { task = "check:svelte-ts" },
]
"test:core-ts" = "bun test packages/core/tests"
"check:core-package" = "sh -c 'cd packages/core && exec bun pm pack --dry-run --ignore-scripts'"
"test:svelte" = "bun x vitest run --config packages/svelte/vitest.config.ts"
"check:svelte-package" = "sh -c 'cd packages/svelte && exec bun pm pack --dry-run --ignore-scripts'"
"generate:layout" = "cargo run -p longhorn-bindings -- layout write"
"check:layout-bindings" = "cargo run -p longhorn-bindings -- layout check"
"test:layout-ts" = "bun test packages/layout/tests"
"check:layout-package" = "sh -c 'cd packages/layout && exec bun pm pack --dry-run --ignore-scripts'"
"generate:surfaces" = "cargo run -p longhorn-bindings -- surfaces write"
"check:surface-bindings" = "cargo run -p longhorn-bindings -- surfaces check"
"test:surfaces-ts" = "bun test packages/surfaces/tests"
"check:surfaces-package" = "sh -c 'cd packages/surfaces && exec bun pm pack --dry-run --ignore-scripts'"
"generate:transfer" = "cargo run -p longhorn-bindings -- transfer write"
"check:transfer-bindings" = "cargo run -p longhorn-bindings -- transfer check"
"test:transfer-ts" = "bun test packages/transfer/tests"
"check:transfer-package" = "sh -c 'cd packages/transfer && exec bun pm pack --dry-run --ignore-scripts'"
"generate:surface-transfer" = "cargo run -p longhorn-bindings -- surface-transfer write"
"check:surface-transfer-bindings" = "cargo run -p longhorn-bindings -- surface-transfer check"
"test:surface-transfer-ts" = "bun test packages/surface-transfer/tests"
"check:surface-transfer-package" = "sh -c 'cd packages/surface-transfer && exec bun pm pack --dry-run --ignore-scripts'"
"test:tauri-transfer" = "cargo test -p longhorn-tauri-transfer --all-features"
"test:tauri-ts" = "bun test packages/tauri/tests"
"check:tauri-package" = "sh -c 'cd packages/tauri && exec bun pm pack --dry-run --ignore-scripts'"
test = [
  { task = "test:rust" },
  { task = "test:core-ts" },
  { task = "test:layout-ts" },
  { task = "test:surfaces-ts" },
  { task = "test:transfer-ts" },
  { task = "test:surface-transfer-ts" },
  { task = "test:tauri-transfer" },
  { task = "test:tauri-ts" },
  { task = "test:svelte" },
  { task = "test:poodle" },
]
"proof-windowing-check" = "cargo +1.85.0 check -p longhorn-tauri-windowing-proof"
"proof-windowing-build" = "sh -c 'cd examples/tauri-windowing-proof/src-tauri && exec cargo +1.85.0 tauri build --bundles app --ci'"
"proof-transfer-check-direct" = "cargo +1.85.0 check -p longhorn-tauri-transfer-proof --no-default-features"
"proof-transfer-check-surface" = "cargo +1.85.0 check -p longhorn-tauri-transfer-proof --no-default-features --features surface-mode"
"proof-transfer-build-direct" = "sh -c 'cd examples/tauri-transfer-proof/src-tauri && exec cargo +1.85.0 tauri build --bundles app --ci'"
"proof-transfer-build-surface" = "sh -c 'cd examples/tauri-transfer-proof/src-tauri && exec cargo +1.85.0 tauri build --bundles app --ci --features surface-mode'"
"proof:app-shells" = "bun scripts/verify-app-shell-proof.ts"
"qa:docs:links" = "effigy docs check links README.md AGENTS.md docs/README.md docs/vision/README.md docs/architecture/README.md docs/contracts/README.md docs/specs/README.md docs/research/README.md docs/roadmaps/README.md docs/roadmaps/g01/README.md docs/logs/README.md"
"qa:docs:index:vision" = "effigy docs check index --policy-index vision"
"qa:docs:agent-defaults" = "effigy docs check forbidden AGENTS.md README.md docs/README.md --forbid '--repo .'"
"qa:docs" = [
  { task = "qa:docs:links" },
  { task = "qa:docs:index:vision" },
  { task = "qa:docs:agent-defaults" },
]
