m-backup-adapters-and-consumer-conformance.md docs/logs/2026-07/28-storage-profile-transition-and-legacy-import.md docs/logs/2026-07/28-layout-container-region-panel-compilation.md docs/policy/internal-writing-style.md"
"qa:northstar:roadmap-suite" = "effigy docs check paths docs/roadmaps/g01/001-foundation-contracts-and-package-topology.md docs/roadmaps/g01/002-configuration-backup-and-recovery.md docs/roadmaps/g01/003-display-geometry-and-window-planning.md docs/roadmaps/g01/004-tauri-window-host-and-lifecycle.md docs/roadmaps/g01/005-layout-container-region-and-panel-core.md docs/roadmaps/g01/006-optional-surfaces-and-cross-window-drag.md docs/roadmaps/g01/007-typescript-svelte-poodle-and-app-shell.md docs/roadmaps/g01/008-settings-registry-and-shell.md docs/roadmaps/g01/009-typed-bridge-and-optional-backend-topology.md docs/roadmaps/g01/010-command-registry-keymaps-and-palette.md docs/roadmaps/g01/011-history-kernel-and-branching-prototype.md docs/roadmaps/g01/012-async-operations-and-notifications.md docs/roadmaps/g01/013-native-content-islands-prototype.md docs/roadmaps/g01/014-nucleus-no-surface-migration.md docs/roadmaps/g01/015-loophole-full-hosting-migration.md docs/roadmaps/g01/016-secondary-consumers-and-greenfield-release.md docs/roadmaps/g01/017-optional-forkable-history-tree.md docs/roadmaps/g01/018-native-content-production-and-adoption-gate.md docs/roadmaps/g01/019-grouped-custom-adapter-restore.md docs/roadmaps/g01/020-child-view-navigation-control.md"
"qa:docs" = [
  { task = "qa:docs:links" },
  { task = "qa:docs:index:vision" },
  { task = "qa:docs:agent-defaults" },
  { task = "held-surface" },
  { task = "host-protocol" },
]
"held-surface" = "bun scripts/verify-held-surface.ts"
"host-protocol" = "bun scripts/verify-host-protocol.ts"
"qa:northstar" = [
  { task = "qa:northstar:spine" },
  { task = "qa:northstar:roadmap-suite" },
  { task = "qa:northstar:links" },
]

# --- Aggregates ---------------------------------------------------------
# Cheap orientation baseline for `effigy doctor`. Full validation is `effigy qa`.
# Mapping health→qa made every doctor run launch the Rust/TS board before an
# agent had picked a bounded task (see PAPERCUTS.md).
health = [
  { task = "fmt:rust" },
  { task = "release:floor" },
]
qa = [
  { task = "fmt:rust" },
  { task = "lint:rust" },
  { task = "lint:rust:features" },
  { task = "test:rust" },
  { task = "check:ts" },
  { task = "check:svelte" },
  { task = "check:packages" },
  { task = "test:ts" },
  { task = "test:vitest" },
  { task = "check:bindings" },
  { task = "check:api-reference" },
  { task = "check:consumer-isolation" },
  { task = "check:repo-containment" },
  { task = "proof:artifacts" },
  { task = "qa:docs" },
  { task = "qa:northstar" },
]

[release]
version-file = "Cargo.toml"
version-path = "workspace.package.version"
changelog = "CHANGELOG.md"
pre-1-0 = true
tag-format = "v{version}"

[release.gates]
private-candidate = "bun scripts/verify-private-candidate-docs-card127.ts"
workspace = "effigy qa"
prototypes = "effigy check:prototypes"
