"build:native-content-isolated-window-proof" = "sh -c 'cd examples/tauri-native-content-isolated-window-proof/src-tauri && exec cargo +1.95.0 tauri build --bundles app --ci'"
"verify:native-content-isolated-window-proof" = '''sh -c 'jq -e '.\''outcome == "pass" and ([.checks[] | select(.status == "pass")] | length == 11) and ([.checks[] | select(.status != "pass")] | length == 0)'\'' examples/tauri-native-content-isolated-window-proof/evidence/runs/2026-08-01-macos-arm64/final-report.json >/dev/null && jq -e '.\''packaged_run.outcome == "pass" and .packaged_run.passed_checks == 11 and .native_boundary.raw_pointer_exports == false and .outer_placement.adapter_position_operations == false and all(.forbidden_edges[]; . == false)'\'' examples/tauri-native-content-isolated-window-proof/evidence/inventory.json >/dev/null && jq -e '.\''targets.macos.status == "packaged-proof-pass" and .targets.windows.status == "unsupported" and .targets.linux.status == "unsupported"'\'' examples/tauri-native-content-isolated-window-proof/evidence/target-support.json >/dev/null && ! rg -n '\''fixture_error|proof_failed'\'' examples/tauri-native-content-isolated-window-proof/evidence/runs/2026-08-01-macos-arm64/runtime-transcript.jsonl' '''
"qa:native-content-isolated-window-proof" = [
  { task = "check:native-content-isolated-window-proof" },
  { task = "verify:native-content-isolated-window-proof" },
]
