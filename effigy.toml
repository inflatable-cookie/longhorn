[catalog]
alias = "longhorn"

[manifest]
include = ["config/release.toml"]

[docs_policy.indexes.vision]
file = "docs/vision/README.md"
dir = "docs/vision"
section = "Vision Artifacts"
exclude = ["history/**"]

[tasks]
# One task per job, not one per package. Per-package variants were hundreds of
# lines of duplication that nothing ever invoked individually; loops and test
# runners cover the same ground.

# --- Rust ---------------------------------------------------------------
# `cargo fmt --all` is not workspace-scoped the way `--workspace` is: it walks
# every *local* package in the graph, so a relative path dependency drags a
# sibling repository in and reformats it under this workspace's style edition.
# Longhorn is edition 2024 and Poodle is 2021, so `poodle-specs` failed here
# while passing its own gate. The package list comes from `--no-deps`, which
# is genuinely members-only.
"fmt:rust" = "sh -c 'exec cargo fmt --check $(cargo metadata --no-deps --format-version 1 | jq -r .packages[].name | sed s/^/-p/)'"
"lint:rust" = "cargo clippy --workspace --all-targets --locked -- -D warnings"
# Second pass: default features leave bindings/supervision/operation and the
# proof examples' surface-mode code uncompiled, so `lint:rust` cannot see them.
"lint:rust:features" = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"
"test:rust" = "cargo test --workspace --locked"
"docs:rust" = "sh -c 'RUSTDOCFLAGS=\"-D warnings\" exec cargo doc --workspace --no-deps --locked'"

# Prototypes are separate workspaces, so no selector above touches them. They
# are the only artefacts binding a Longhorn seam to a real host SDK, and until
# this existed the one proving the GPUI seam was the one thing nothing built —
# it was broken by a signature change and caught by a hand-run.
#
# `check` rather than `build`: the failure mode is API drift, which type
# checking catches, and `gpui` alone is 757 packages and 3.3 GiB of artifacts
# once linked. Deliberately absent from `qa`; wired into the release gates
# instead, because "the host seam still matches its SDK" is a claim that must
# hold before a tag rather than before every commit.
"check:prototypes" = "sh -c 'for d in prototypes/*/; do (cd \"$d\" && cargo check --all-targets --locked) || exit 1; done'"

# --- TypeScript and Svelte ----------------------------------------------
"check:ts" = "sh -c 'for c in packages/*/tsconfig.json; do bun x tsc -p \"$c\" || exit 1; done'"
"check:svelte" = "bun x svelte-check --tsconfig packages/longhorn-poodle-svelte/tsconfig.json"
"check:packages" = "sh -c 'for d in packages/*/; do (cd \"$d\" && bun pm pack --dry-run --ignore-scripts >/dev/null) || exit 1; done'"
"test:ts" = "bash scripts/test-packages.sh"
"test:vitest" = "sh -c 'for c in packages/*/vitest.config.ts; do bun x vitest run --config \"$c\" || exit 1; done'"

# --- Generated protocol bindings ----------------------------------------
"check:bindings" = "sh -c 'for d in bridge commands config history history-tree layout native-content notifications operation settings surfaces surface-transfer transfer; do cargo run -q -p longhorn-bindings -- \"$d\" check || exit 1; done'"
"generate:bindings" = "sh -c 'for d in bridge commands config history history-tree layout native-content notifications operation settings surfaces surface-transfer transfer; do cargo run -q -p longhorn-bindings -- \"$d\" write || exit 1; done'"
"check:api-reference" = "bun scripts/generate-api-reference-card126.ts"
"check:consumer-isolation" = "bun scripts/verify-consumer-isolation.ts"
"check:repo-containment" = "bun scripts/verify-repo-containment.ts"
"generate:api-reference" = "bun scripts/generate-api-reference-card126.ts --write"

# --- Artifact proofs ----------------------------------------------------
# Each script builds isolated artifacts and asserts one composition claim.
"proof:artifacts" = "sh -c 'for s in app-shell-proof bridge-topology-conformance bridge-topology-artifacts settings-composition-proof command-system-artifacts history-system-artifacts history-tree-artifacts operation-notification-artifacts native-content-artifacts poodle-preview greenfield-card125 guides-card126; do echo \"proof $s\"; bun \"scripts/verify-$s.ts\" >/dev/null || exit 1; done'"

# --- Release ------------------------------------------------------------
"release:floor" = "bash scripts/check-release-floor.sh"
"release:source-consumer" = "bash scripts/verify-source-consumer.sh"
"release:gates" = [
  { task = "release:floor" },
  { task = "release:source-consumer" },
  { task = "check:prototypes" },
]

# --- Documentation ------------------------------------------------------
"qa:northstar:links" = "effigy docs check links"
"qa:docs:links" = "effigy docs check links README.md AGENTS.md docs/README.md docs/vision/README.md docs/architecture/README.md docs/contracts/README.md docs/specs/README.md docs/research/README.md docs/guides/README.md docs/guides/getting-started.md docs/roadmaps/README.md docs/roadmaps/g01/README.md docs/logs/README.md"
"qa:docs:index:vision" = "effigy docs check index --policy-index vision"
"qa:docs:agent-defaults" = "effigy docs check forbidden AGENTS.md README.md docs/README.md --forbid '--repo .'"
"qa:northstar:spine" = "effigy docs check paths README.md AGENTS.md CHANGELOG.md scripts/README.md docs/README.md docs/vision/README.md docs/architecture/README.md docs/architecture/system-architecture.md docs/architecture/package-topology.md docs/architecture/system-inventory.md docs/architecture/repo-authority-map.md docs/architecture/product-guardrails.md docs/contracts/README.md docs/contracts/001-working-rules.md docs/contracts/002-composable-workspace-hosting.md docs/contracts/003-extraction-and-consumer-migration.md docs/contracts/004-configuration-storage-backup-and-recovery.md docs/contracts/005-settings-and-system-registration.md docs/contracts/006-command-action-and-input.md docs/contracts/007-optional-backend-topology.md docs/contracts/008-history-kernel-boundary.md docs/contracts/009-display-identity-coordinates-and-window-planning.md docs/contracts/010-rust-typescript-ipc-and-events.md docs/contracts/011-cross-window-transfer.md docs/contracts/012-distribution-and-compatibility.md docs/contracts/013-svelte-and-poodle-adapter-lifecycle.md docs/contracts/014-layout-container-region-and-panel-core.md docs/contracts/contract-index.md docs/guides/README.md docs/guides/getting-started.md docs/specs/README.md docs/specs/001-shared-desktop-system-suite.md docs/specs/archive/README.md docs/research/README.md docs/research/master-index.md docs/research/research-to-implementation-playbook.md docs/research/translation-memos/001-tauri-application-extraction-audit.md docs/research/translation-memos/002-shared-desktop-systems-follow-up.md docs/research/translation-memos/003-foundation-boundary-characterization.md docs/research/translation-memos/004-configuration-coordination-and-atomic-mutation.md docs/research/translation-memos/005-debounced-mutation-and-explicit-flush.md docs/research/translation-memos/006-backup-archive-encryption-and-restore.md docs/research/translation-memos/007-cross-platform-storage-layout-profiles.md docs/research/translation-memos/008-tauri-