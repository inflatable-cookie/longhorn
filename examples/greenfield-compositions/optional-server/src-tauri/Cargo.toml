[package]
name = "longhorn-greenfield-optional-server-tauri"
version = "0.0.0"
edition.workspace = true

[features]
default = ["server"]
server = [
  "dep:longhorn-bridge",
  "longhorn-bridge/supervision",
  "dep:longhorn-tauri-bridge",
]

[dependencies]
longhorn-bridge = { workspace = true, optional = true }
longhorn-config.workspace = true
longhorn-core.workspace = true
longhorn-settings.workspace = true
longhorn-settings-config.workspace = true
longhorn-tauri-bridge = { workspace = true, optional = true }
longhorn-tauri-config.workspace = true
longhorn-tauri-settings.workspace = true
longhorn-greenfield-proof-common = { path = "../../common-rust" }
serde_json.workspace = true
tauri.workspace = true
