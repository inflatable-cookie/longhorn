<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview Island</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font:
          16px/1.4 -apple-system,
          system-ui,
          sans-serif;
        color: #101318;
        padding: 24px;
      }
      #counter {
        font:
          700 48px/1 -apple-system,
          system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
        margin: 0 0 16px;
      }
    </style>
  </head>
  <body>
    <div id="counter">0</div>
    <p>Preview island: a child webview, visible in screenshots only.</p>
    <script>
      // The island's own freshness oracle (Card 238): same 1 Hz ticker shape
      // as the parent page but a distinct hue encoding (97° stride, lighter
      // lightness) so the matrix can judge the two surfaces apart. The
      // island is not a semantic target — its counter is read from the PNG,
      // bracketed by the parent webview's `evaluate` counter reads (both
      // tickers start at page load and tick at 1 Hz).
      let counter = 0;
      const ticker = document.getElementById("counter");
      setInterval(() => {
        counter += 1;
        ticker.textContent = String(counter);
        document.body.style.backgroundColor = `hsl(${(counter * 97) % 360} 70% 55%)`;
      }, 1000);
    </script>
  </body>
</html>
