<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Longhorn Windowing Proof</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <header data-tauri-drag-region>
        <div>
          <h1>Longhorn window host</h1>
          <p>Packaged public-API proof. Move and resize this native window, then let it settle.</p>
        </div>
        <div class="badge" id="window-label">loading</div>
      </header>

      <section class="controls" id="main-controls">
        <button data-command="refresh">Refresh evidence</button>
        <button data-command="toggle-maximized">Toggle maximized through host</button>
        <button data-command="create-workspace">Create dynamic workspace</button>
        <button data-command="close-workspace">Close dynamic workspace</button>
        <button data-command="protected-primary">Prove protected primary survival</button>
        <button data-command="missing-display">Prepare missing-display restart</button>
        <button data-command="flush">Flush staged placement</button>
        <button class="danger" data-command="quit">Flush, teardown, and quit</button>
      </section>

      <section class="controls" id="workspace-controls" hidden>
        <button data-command="refresh">Refresh evidence</button>
        <button data-command="close-workspace">Close this dynamic window</button>
      </section>

      <div class="panel">
        <div class="panel-label">Structured runtime state</div>
        <pre id="status">Waiting for page-ready handshake…</pre>
      </div>
      <div id="message" aria-live="polite"></div>
    </main>
  </body>
</html>
