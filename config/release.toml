# Release configuration for the Longhorn workspace.
#
# The repository root is a virtual Cargo workspace: it has no `[package]`, so
# effigy's default version probe cannot find the version. The field is named
# explicitly, matching Signal's shape.
#
# This file is the only `[release]` definition; effigy.toml includes it.
[release]
version-file = "Cargo.toml"
version-path = "workspace.package.version"
changelog = "CHANGELOG.md"
pre-1-0 = true
# Effigy owns the lockfile sync from 0.9.1. It runs `cargo update --workspace`
# (not `cargo generate-lockfile`, which re-resolves the whole graph), applies it
# *before* the gates, and refuses if any line other than the bumped workspace
# version moved. That is the same guarantee check-release-floor.sh used to hand-
# roll, so the script's copy was deleted along with its dependency on `floor`
# sorting alphabetically ahead of the other --locked gates.
#
# The sync is not optional: prepare bumps the version before gating, so without
# it every `--locked` gate refuses to run in the window between.
sync-files = ["Cargo.lock"]
tag-format = "v{version}"
initial-tag-current-version = true

# Gates run before a release is prepared or executed. This is the only
# `[release.gates]` table; effigy.toml includes this file and declares none of
# its own. Two tables merged cleanly, which is exactly why the duplication
# survived: the Rust board was declared here *and* reached again through
# `workspace`, so fmt, both Clippy passes and the full test suite each ran
# twice per release. Every gate below is either `effigy qa` or something qa
# does not cover.
#
# Listed cheapest-first. Effigy PR 48 runs `[release.gates]` in declaration
# order, so the 38ms candidate check precedes the 145s MSRV floor. Do not
# rename gates to force order — `verify-private-candidate-docs-card127.ts`
# asserts two of these lines verbatim.
[release.gates]
# Docs-level candidate assertion. 38ms.
private-candidate = "bun scripts/verify-private-candidate-docs-card127.ts"
# The advisory database against the dated allowances in deny.toml.
advisories = "cargo deny check advisories"
# Rustdoc warnings are denied. Not in `qa`: it is a release-shaped concern and
# the slowest of the cheap gates.
rustdoc = "effigy docs:rust"
# Workspace-excluded prototypes still have to build against the crates they
# probe -- a workspace crate gaining a dependency goes stale here first.
prototypes = "effigy check:prototypes"
# The whole local board: fmt, both Clippy passes, the Rust and TypeScript test
# suites, the bindings and seam gates, and every artifact proof. Declared once
# in effigy.toml's `qa` aggregate rather than transcribed here.
#
# Left unwrapped on purpose. The removed duplicates carried `nice -n 5`, and
# wrapping this gate to keep that would break the card-127 candidate proof,
# which asserts this line verbatim. The heaviest lane, `release:floor`, nices
# itself; qa runs at normal priority the same way an agent runs it.
workspace = "effigy qa"
# Enforces the declared MSRV with real Clippy and tests at the floor
# toolchain, not a bare check -- the 1.90 floor was false for weeks because a
# transitive build script only failed under --all-targets. Not redundant with
# qa's Clippy: several lints only fire once the floor's language features
# exist, so the two lanes see different lint sets.
floor = "effigy release:floor"
# Proves the release commit is consumable as a git dependency: a throwaway
# consumer resolves every probed crate from a git source, not a path.
source = "effigy release:source-consumer"
