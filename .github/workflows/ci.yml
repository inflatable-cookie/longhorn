name: CI

# Manual, pull requests, and release tags only. Ordinary pushes to branches
# deliberately do not trigger a run: local `effigy qa` covers day-to-day work,
# and CI exists to prove a clean clone with no sibling checkouts, no [patch]
# config, and no warm caches -- the environment consumers of a tag are in.
# Manual dispatch only. Every job here runs on macOS, because `effigy qa`
# builds longhorn-gpui-windowing and gpui pulls metal, and macOS bills at ten
# times the Linux rate on a private repository. A pull_request trigger on that
# footing exhausted the org's Actions allowance. Run `effigy qa` locally, and
# dispatch this before a tag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust format, lint, and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Not `--all`: that walks every *local* package in the graph, so a
      # relative path dependency drags a sibling repository into this
      # repository's format gate and applies the wrong style edition to it.
      # `--no-deps` is genuinely members-only.
      - name: Format
        run: sh -c 'exec cargo fmt --check $(cargo metadata --no-deps --format-version 1 | jq -r .packages[].name | sed s/^/-p/)'
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Default features leave bindings/supervision/operation and the proof
      # examples' surface-mode code uncompiled; both passes are needed.
      - name: Clippy with all features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  rust-floor:
    name: Rust 1.95 floor
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-1.95
      - name: Clippy at the floor
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy at the floor with all features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test at the floor
        run: cargo test --workspace --locked

  clients:
    name: TypeScript, Svelte, and generated bindings
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Type check every package
        run: |
          for config in packages/*/tsconfig.json; do
            echo "tsc $config"
            bun x tsc -p "$config"
          done
      - name: Package test suites
        run: |
          bash scripts/test-packages.sh
          bun x vitest run --config packages/longhorn-poodle-svelte/vitest.config.ts
      - name: Svelte type gate
        run: bun x svelte-check --tsconfig packages/longhorn-poodle-svelte/tsconfig.json --threshold error
      - name: Generated bindings are current
        run: |
          for domain in bridge commands config history history-tree layout \
            native-content notifications operation settings surfaces \
            surface-transfer transfer; do
            cargo run -q -p longhorn-bindings -- "$domain" check
          done

  external-source:
    name: External Git-source consumer
    # macOS, like every other job: the probe crates pull the Tauri stack, which
    # needs GTK/glib system packages on Linux that ubuntu-latest does not carry.
    # Longhorn targets macOS and the local release gate runs there, so proving
    # git-source consumption on Linux would be proving the wrong claim.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Consumable as a git dependency
        run: bash scripts/verify-source-consumer.sh
