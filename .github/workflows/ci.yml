name: CI

# Manual, pull requests, and release tags only. Ordinary pushes to branches
# deliberately do not trigger a run: local `effigy qa` covers day-to-day work,
# and CI exists to prove a clean clone with no sibling checkouts, no [patch]
# config, and no warm caches -- the environment consumers of a tag are in.
# Manual dispatch only. Every job here runs on macOS, because `effigy qa`
# builds longhorn-gpui-windowing and gpui pulls metal, and macOS bills at ten
# times the Linux rate on a private repository. A pull_request trigger on that
# footing exhausted the org's Actions allowance. Run `effigy qa` locally, and
# dispatch this before a tag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commit SHAs (the tag is in the comment): tags are
# mutable, and a compromised action is the other half of the supply-chain
# problem. Effigy runs the same selectors a local `effigy qa` runs -- a
# hand-transcribed copy of the gate list drifted twice before release.yml
# proved the point.

jobs:
  rust:
    name: Rust format, lint, and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: inflatable-cookie/setup-effigy@987fd556617ea2c3e0ab5cef6b47b250817f50c8 # v1
        with:
          version: '0.11.0'
      - name: Format
        run: effigy fmt:rust
      - name: Clippy
        run: effigy lint:rust
      # Default features leave bindings/supervision/operation and the proof
      # examples' surface-mode code uncompiled; both passes are needed.
      - name: Clippy with all features
        run: effigy lint:rust:features
      - name: Test
        run: effigy test:rust

  rust-floor:
    name: Rust floor
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Read from release-baselines/rust-toolchains.env rather than written
      # here. That file is the floor's single declaration and a copy in this
      # workflow would be one more thing to bump twice.
      - name: Read the declared floor toolchain
        id: floor
        run: |
          set -euo pipefail
          source release-baselines/rust-toolchains.env
          echo "msrv=$LONGHORN_GENERAL_MSRV" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.floor.outputs.msrv }}
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: rust-floor
      - name: Floor lane
        run: effigy release:floor

  clients:
    name: TypeScript, Svelte, and generated bindings
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14' # pinned: the version local qa runs
      - uses: inflatable-cookie/setup-effigy@987fd556617ea2c3e0ab5cef6b47b250817f50c8 # v1
        with:
          version: '0.11.0'
      - run: bun install --frozen-lockfile
      - name: Type check every package
        run: effigy check:ts
      - name: Package test suites
        run: |
          effigy test:ts
          effigy test:vitest
      - name: Svelte type gate
        run: effigy check:svelte
      - name: Generated bindings are current
        run: effigy check:bindings

  external-source:
    name: External Git-source consumer
    # macOS, like every other job: the probe crates pull the Tauri stack, which
    # needs GTK/glib system packages on Linux that ubuntu-latest does not carry.
    # Longhorn targets macOS and the local release gate runs there, so proving
    # git-source consumption on Linux would be proving the wrong claim.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: inflatable-cookie/setup-effigy@987fd556617ea2c3e0ab5cef6b47b250817f50c8 # v1
        with:
          version: '0.11.0'
      - name: Consumable as a git dependency
        run: effigy release:source-consumer
