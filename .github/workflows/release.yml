name: Release

# Publishes the three TypeScript packages to npm and is the tag's evidence run.
#
# No NPM_TOKEN. Publication uses npm trusted publishing: npmjs.com is
# configured to accept publishes for each package only from this repository and
# this workflow file, and npm authenticates with a short-lived OIDC token minted
# per run. Nothing long-lived is stored in GitHub, so there is no secret for a
# compromised dependency to exfiltrate and nothing to rotate. Provenance
# attestation comes with it rather than being a separate step.
#
# Gates run through Effigy via inflatable-cookie/setup-effigy, so this workflow
# executes the same selectors as a local run rather than a hand-transcribed
# copy of them that can drift. Do not reach for `bunx effigy` -- an unrelated
# package of that name exists on npm, and fetching it inside a workflow holding
# publish rights is the exact hazard trusted publishing exists to remove.
#
# Before the first run, each package needs its trusted publisher configured at
# npmjs.com -> package -> Settings -> Trusted Publisher, naming this repository
# and `release.yml`. Until that exists the publish step fails closed.
#
# Rust is not published here. Every crate sets `publish = false` and consumers
# take them by git tag, so the Rust half of a release is the tag itself.

# Dispatch this workflow AGAINST THE TAG, not against main:
#
#     git tag v0.1.0 && git push origin v0.1.0
#     gh workflow run release.yml --ref v0.1.0 -f dry-run=false
#
# workflow_dispatch accepts a tag ref, so `github.ref` is `refs/tags/v0.1.0`
# and the version-agrees-with-tag check below still fires. There is no
# `push: tags` trigger: publication should be an act someone performs, not a
# side effect of pushing a tag, and during first publication a tag push would
# fire a run that tries to republish versions already on the registry.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm
    runs-on: macos-latest
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for publish rights. This is the
      # whole reason no secret is needed.
      id-token: write
    steps:
      # TODO harden: pin these to commit SHAs rather than tags. Tags are
      # mutable and a compromised action is the other half of the supply-chain
      # problem trusted publishing solves for tokens.
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: inflatable-cookie/setup-effigy@v1
        with:
          version: '0.9.1'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; the one bundled with Node is
      # usually older than the OIDC support.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: bun install --frozen-lockfile

      # The full suite, including check:bindings -- publishing a package whose
      # generated protocol has drifted from the Rust authority would ship a lie.
      - name: Full QA gate
        run: effigy qa

      - name: Release gates
        run: effigy release:gates

      # Contract 012 and the lockstep decision of 2026-08-09: every Rust crate
      # and every TypeScript package across both repositories carries one
      # version. On a tag push, that version is the tag.
      - name: Versions agree with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          status=0
          for manifest in packages/*/package.json; do
            version=$(node -p "require('./$manifest').version")
            if [ "$version" != "$tag" ]; then
              echo "$manifest is $version, tag is $tag"
              status=1
            fi
          done
          workspace=$(cargo metadata --no-deps --format-version 1 \
            | node -e 'const m=JSON.parse(require("fs").readFileSync(0,"utf8"));
                       const v=[...new Set(m.packages.map(p=>p.version))];
                       console.log(v.join(" "))')
          if [ "$workspace" != "$tag" ]; then
            echo "crate versions are [$workspace], tag is $tag"
            status=1
          fi
          exit "$status"

      - name: Pack and inspect
        run: |
          set -euo pipefail
          mkdir -p .release
          for dir in packages/*/; do
            (cd "$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/.release")
          done
          ls -l .release

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            (cd "$dir" && npm publish --access public)
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packed-tarballs
          path: .release/*.tgz
