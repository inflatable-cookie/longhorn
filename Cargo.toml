[workspace]
members = [
  "crates/longhorn-bindings",
  "crates/longhorn-bridge",
  "crates/longhorn-browser",
  "crates/longhorn-command",
  "crates/longhorn-command-config",
  "crates/longhorn-command-settings",
  "crates/longhorn-config",
  "crates/longhorn-config-age",
  "crates/longhorn-core",
  "crates/longhorn-credential-keyring",
  "crates/longhorn-display",
  "crates/longhorn-gpui-windowing",
  "crates/longhorn-history",
  "crates/longhorn-history-tree",
  "crates/longhorn-licence",
  "crates/longhorn-native-content",
  "crates/longhorn-native-content-backing-surface",
  "crates/longhorn-native-content-isolated-window",
  "crates/longhorn-tauri-native-content-child-view",
  "crates/longhorn-notifications",
  "crates/longhorn-operation",
  "crates/longhorn-poodle",
  "crates/longhorn-settings",
  "crates/longhorn-settings-config",
  "crates/longhorn-tauri-bridge",
  "crates/longhorn-tauri-command",
  "crates/longhorn-tauri-history",
  "crates/longhorn-tauri-history-tree",
  "crates/longhorn-tauri-licence",
  "crates/longhorn-tauri-notifications",
  "crates/longhorn-tauri-operation",
  "crates/longhorn-tauri-settings",
  "crates/longhorn-surface-windowing",
  "crates/longhorn-surface-transfer",
  "crates/longhorn-surfaces",
  "crates/longhorn-surfaces-config",
  "crates/longhorn-transfer",
  "crates/longhorn-update",
  "crates/longhorn-update-install",
  "crates/longhorn-tauri-config",
  "crates/longhorn-tauri-transfer",
  "crates/longhorn-tauri-update",
  "crates/longhorn-tauri-windowing",
  "crates/longhorn-windowing",
  "crates/longhorn-windowing-config",
  "examples/nucleus-no-surface-proof",
  "examples/packaged-update-proof",
  "examples/tauri-update-proof/src-tauri",
  "examples/tauri-windowing-proof/src-tauri",
  "examples/update-licence-proof/rust/harness",
]
exclude = [
  "prototypes/native-content",
  "prototypes/native-content-isolated-window",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/inflatable-cookie/longhorn"

[workspace.dependencies]
age = { version = "=0.12.1", default-features = false }
base64 = "0.22.1"
cap-std = "4.0.2"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
flate2 = "1.1.9"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
getrandom = "0.3.4"
longhorn-bridge = { path = "crates/longhorn-bridge", version = "0.1.0" }
longhorn-browser = { path = "crates/longhorn-browser", version = "0.1.0" }
longhorn-command = { path = "crates/longhorn-command", version = "0.1.0" }
longhorn-command-config = { path = "crates/longhorn-command-config", version = "0.1.0" }
longhorn-command-settings = { path = "crates/longhorn-command-settings", version = "0.1.0" }
longhorn-core = { path = "crates/longhorn-core", version = "0.1.0" }
longhorn-credential-keyring = { path = "crates/longhorn-credential-keyring", version = "0.1.0" }
longhorn-config = { path = "crates/longhorn-config", version = "0.1.0" }
longhorn-config-age = { path = "crates/longhorn-config-age", version = "0.1.0" }
longhorn-display = { path = "crates/longhorn-display", version = "0.1.0" }
longhorn-gpui-windowing = { path = "crates/longhorn-gpui-windowing", version = "0.1.0" }
longhorn-history = { path = "crates/longhorn-history", version = "0.1.0" }
longhorn-history-tree = { path = "crates/longhorn-history-tree", version = "0.1.0" }
longhorn-licence = { path = "crates/longhorn-licence", version = "0.1.0" }
longhorn-native-content = { path = "crates/longhorn-native-content", version = "0.1.0" }
longhorn-native-content-backing-surface = { path = "crates/longhorn-native-content-backing-surface", version = "0.1.0" }
longhorn-native-content-isolated-window = { path = "crates/longhorn-native-content-isolated-window", version = "0.1.0" }
longhorn-tauri-native-content-child-view = { path = "crates/longhorn-tauri-native-content-child-view", version = "0.1.0" }
longhorn-notifications = { path = "crates/longhorn-notifications", version = "0.1.0" }
longhorn-operation = { path = "crates/longhorn-operation", version = "0.1.0" }
longhorn-poodle = { path = "crates/longhorn-poodle", version = "0.1.0" }
longhorn-settings = { path = "crates/longhorn-settings", version = "0.1.0" }
longhorn-settings-config = { path = "crates/longhorn-settings-config", version = "0.1.0" }
longhorn-tauri-bridge = { path = "crates/longhorn-tauri-bridge", version = "0.1.0" }
longhorn-tauri-command = { path = "crates/longhorn-tauri-command", version = "0.1.0" }
longhorn-tauri-config = { path = "crates/longhorn-tauri-config", version = "0.1.0" }
longhorn-tauri-history = { path = "crates/longhorn-tauri-history", version = "0.1.0" }
longhorn-tauri-history-tree = { path = "crates/longhorn-tauri-history-tree", version = "0.1.0" }
longhorn-tauri-licence = { path = "crates/longhorn-tauri-licence", version = "0.1.0" }
longhorn-tauri-notifications = { path = "crates/longhorn-tauri-notifications", version = "0.1.0" }
longhorn-tauri-operation = { path = "crates/longhorn-tauri-operation", version = "0.1.0" }
longhorn-tauri-settings = { path = "crates/longhorn-tauri-settings", version = "0.1.0" }
longhorn-surface-windowing = { path = "crates/longhorn-surface-windowing", version = "0.1.0" }
longhorn-surface-transfer = { path = "crates/longhorn-surface-transfer", version = "0.1.0" }
longhorn-surfaces = { path = "crates/longhorn-surfaces", version = "0.1.0" }
longhorn-surfaces-config = { path = "crates/longhorn-surfaces-config", version = "0.1.0" }
longhorn-transfer = { path = "crates/longhorn-transfer", version = "0.1.0" }
longhorn-update = { path = "crates/longhorn-update", version = "0.1.0" }
longhorn-update-install = { path = "crates/longhorn-update-install", version = "0.1.0" }
longhorn-tauri-transfer = { path = "crates/longhorn-tauri-transfer", version = "0.1.0" }
longhorn-tauri-update = { path = "crates/longhorn-tauri-update", version = "0.1.0" }
longhorn-tauri-windowing = { path = "crates/longhorn-tauri-windowing", version = "0.1.0" }
longhorn-windowing = { path = "crates/longhorn-windowing", version = "0.1.0" }
longhorn-windowing-config = { path = "crates/longhorn-windowing-config", version = "0.1.0" }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
minisign = "0.9.1"
minisign-verify = "0.2.5"
rusqlite = { version = "=0.40.1", features = ["backup", "bundled"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
secrecy = "0.10.3"
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.44"
tempfile = "3.27.0"
tauri = { version = "2.10.3", default-features = false }
tauri-build = { version = "=2.6.3", default-features = false, features = ["config-json"] }
ts-rs = { version = "=11.1.0", default-features = false, features = ["no-serde-warnings", "serde-compat"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
