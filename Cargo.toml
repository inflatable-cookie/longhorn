[workspace]
members = [
  "crates/longhorn-bindings",
  "crates/longhorn-config",
  "crates/longhorn-config-age",
  "crates/longhorn-core",
  "crates/longhorn-display",
  "crates/longhorn-layout",
  "crates/longhorn-layout-config",
  "crates/longhorn-settings",
  "crates/longhorn-settings-config",
  "crates/longhorn-tauri-settings",
  "crates/longhorn-surface-windowing",
  "crates/longhorn-surface-transfer",
  "crates/longhorn-surfaces",
  "crates/longhorn-surfaces-config",
  "crates/longhorn-transfer",
  "crates/longhorn-tauri-config",
  "crates/longhorn-tauri-transfer",
  "crates/longhorn-tauri-windowing",
  "crates/longhorn-windowing",
  "crates/longhorn-windowing-config",
  "examples/nucleus-no-surface-proof",
  "examples/tauri-transfer-proof/src-tauri",
  "examples/tauri-windowing-proof/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/inflatable-cookie/longhorn"

[workspace.dependencies]
age = { version = "=0.12.1", default-features = false }
cap-std = "4.0.2"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
longhorn-core = { path = "crates/longhorn-core", version = "0.1.0" }
longhorn-config = { path = "crates/longhorn-config", version = "0.1.0" }
longhorn-config-age = { path = "crates/longhorn-config-age" }
longhorn-display = { path = "crates/longhorn-display" }
longhorn-layout = { path = "crates/longhorn-layout" }
longhorn-layout-config = { path = "crates/longhorn-layout-config" }
longhorn-settings = { path = "crates/longhorn-settings", version = "0.1.0" }
longhorn-settings-config = { path = "crates/longhorn-settings-config" }
longhorn-tauri-settings = { path = "crates/longhorn-tauri-settings" }
longhorn-surface-windowing = { path = "crates/longhorn-surface-windowing" }
longhorn-surface-transfer = { path = "crates/longhorn-surface-transfer" }
longhorn-surfaces = { path = "crates/longhorn-surfaces" }
longhorn-surfaces-config = { path = "crates/longhorn-surfaces-config" }
longhorn-transfer = { path = "crates/longhorn-transfer" }
longhorn-tauri-transfer = { path = "crates/longhorn-tauri-transfer" }
longhorn-tauri-windowing = { path = "crates/longhorn-tauri-windowing" }
longhorn-windowing = { path = "crates/longhorn-windowing" }
longhorn-windowing-config = { path = "crates/longhorn-windowing-config" }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rusqlite = { version = "=0.31.0", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
tauri = { version = "2.10.3", default-features = false }
tauri-build = { version = "=2.6.3", default-features = false, features = ["config-json"] }
ts-rs = { version = "=11.0.0", default-features = false, features = ["no-serde-warnings", "serde-compat"] }
zip = { version = "=5.1.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
