# cargo deny configuration.
#
# Advisories are gated in the release flow (`advisories` gate in
# effigy.toml's [release.gates]). Vulnerability-class advisories stay denied.
# The 0.3.0 dependency sweep (2026-09-27) removed the 13 stale allowances:
# the gtk3-rs `unmaintained` advisories were withdrawn upstream on
# 2026-08-14, and the `unic-*` ones no longer match anything the refreshed
# graph resolves. proc-macro-error (unmaintained) is the one remaining
# transitive allowance, still reached through Tauri 2's build chain.

[advisories]
ignore = [
  # proc-macro-error (unmaintained) — via Tauri build chain.
  "RUSTSEC-2024-0370",
]

[bans]
# Duplicate versions land as warnings, not errors: they are upstream-pinned
# (base64 0.21.7 via swift-rs and 0.22.1 via age/reqwest/wry/tauri-codegen,
# sha2 0.10.9 via age/wry/secret-service) and none are ours to chase.
multiple-versions = "warn"
