# cargo deny configuration.
#
# Advisories are gated in the release flow (`advisories` gate in
# effigy.toml's [release.gates]). Vulnerability-class advisories stay denied.
# The 0.3.0 dependency sweep (2026-09-27) removed the 13 stale allowances:
# the gtk3-rs `unmaintained` advisories were withdrawn upstream on
# 2026-08-14, and the `unic-*` ones no longer match anything the refreshed
# graph resolves. proc-macro-error (unmaintained) is still reached through
# Tauri 2's build chain. zbus_names, zvariant and zvariant_derive
# (unmaintained) joined it on 2026-10-18.

[advisories]
ignore = [
  # proc-macro-error (unmaintained) — via the Tauri/gtk build chain and, since
  # the RUSTSEC-2026-0387 repair, via age 0.11.5 -> i18n-embed-fl 0.9.1 (the
  # newest ^0.9 release that does not use the unmaintained proc-macro-error2
  # fork instead). Proc macros only; build-time only.
  "RUSTSEC-2024-0370",
  # zbus_names 4.3.4, zvariant 5.15.0, zvariant_derive 5.15.0 (unmaintained)
  # — via keyring 4.2.0 -> zbus-secret-service-keyring-store ->
  # secret-service -> zbus 5, on the Linux secret-service path of
  # longhorn-credential-keyring. Upstream merged them into zbus 6, which
  # keyring 4.2.0 (the newest) does not use yet. Not vulnerabilities; no
  # upgrade drops them. Accepted 2026-10-18.
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
  # basic-toml 0.1.10 (unmaintained) — age -> i18n-embed-fl /
  # i18n-embed-impl -> i18n-config -> basic-toml, proc macros only.
  # Not vulnerable; no upgrade drops it; build-time only. Accepted 2026-10-20.
  "RUSTSEC-2026-0374",
]

[bans]
# Duplicate versions land as warnings, not errors: they are upstream-pinned
# (base64 0.21.7 via age/swift-rs and 0.22.1 via reqwest/wry/tauri-codegen,
# sha2 0.10.9 via age/wry/secret-service; the RUSTSEC-2026-0387 repair added
# rustc-hash 1.1.0 and self_cell 0.10.3 alongside their 2.x/1.x counterparts
# through the fluent line i18n-embed 0.15 needs, and hashbrown 0.14.5
# alongside the other three copies through the dashmap i18n-embed-fl 0.9.1
# uses) and none are ours to chase.
multiple-versions = "warn"
