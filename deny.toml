# cargo deny configuration.
#
# Advisories are gated in the release flow (`advisories` gate in
# effigy.toml's [release.gates]). Vulnerability-class advisories stay denied.
# The allow list below is the complete known set as of 2026-08-14 — every
# entry is `unmaintained`-class, transitive through Tauri 2's GTK3/webkit
# stack, and unactionable until Tauri moves off them. Each is revisited at a
# Tauri upgrade or a dependency sweep (g02.027).

[advisories]
ignore = [
  # proc-macro-error (unmaintained) — via Tauri build chain.
  "RUSTSEC-2024-0370",
  # GTK3 bindings (unmaintained) — via wry 0.55.1, Tauri's Linux webview.
  "RUSTSEC-2024-0411", # gdkwayland-sys
  "RUSTSEC-2024-0412", # gdkx11-sys
  "RUSTSEC-2024-0413", # gio-sys / gdk-pixbuf family
  "RUSTSEC-2024-0415", # gtk-sys family
  "RUSTSEC-2024-0416", # gtk-rs core family
  "RUSTSEC-2024-0418", # gtk3 family
  "RUSTSEC-2024-0419", # gtk3-macros family
  "RUSTSEC-2024-0420", # gtk-sys
  # unic-* (unmaintained) — via urlpattern, transitive through Tauri.
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]

[bans]
# Duplicate versions land as warnings, not errors: two are upstream-pinned
# (base64 0.21.7 via swift-rs, sha2 0.10.9 via age/ed25519-dalek) and none
# are ours to chase.
multiple-versions = "warn"
