[workspace]
members = ["proof-app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
axum = "0.8.4"
base64 = "0.22.1"
block2 = "0.6.2"
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", features = ["NSBitmapImageRep", "NSImage"] }
objc2-foundation = { version = "0.3.2", features = [
    "NSData",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSValue",
    "NSString",
] }
objc2-web-kit = { version = "0.3.2", features = [
    "WKSnapshotConfiguration",
    "WKWebView",
    "block2",
] }
rmcp = { version = "3.1.3", features = ["transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "=2.10.3", default-features = false, features = ["wry"] }
tauri-build = { version = "2.6.3", default-features = false, features = ["config-json"] }
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "sync"] }

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
all = "deny"
