<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Longhorn Backing Surface Proof</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      html, body { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; }
      .chrome { position: absolute; background: #181b22; color: #f2f4f8; box-sizing: border-box; }
      header { inset: 0 0 auto 0; height: 64px; padding: 20px 24px; border-bottom: 1px solid #343945; }
      aside { inset: 64px auto 48px 0; width: 96px; padding: 24px 16px; border-right: 1px solid #343945; }
      footer { inset: auto 0 0 0; height: 48px; padding: 15px 24px; border-top: 1px solid #343945; }
      .right { inset: 64px 0 48px auto; width: calc(100% - 540px); min-width: 0; border-left: 1px solid #343945; }
      .viewport-hole { position: absolute; left: 120px; top: 90px; width: 420px; height: 280px; background: transparent; }
      small { color: #a8afbd; }
    </style>
  </head>
  <body>
    <header class="chrome">Longhorn native backing surface <small>controlled proof</small></header>
    <aside class="chrome">Tools</aside>
    <div class="viewport-hole" aria-label="Measured transparent renderer viewport"></div>
    <div class="chrome right"></div>
    <footer class="chrome">Viewport: 120 × 90 · 420 × 280 CSS px</footer>
  </body>
</html>
