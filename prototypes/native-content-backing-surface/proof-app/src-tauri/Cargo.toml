[package]
name = "longhorn-native-content-backing-surface-proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
longhorn-core.workspace = true
longhorn-native-content-backing-surface-prototype = { path = "../../adapter" }
longhorn-native-content-prototype.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSColor", "NSGraphics", "NSView", "NSWindow", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "objc2-core-graphics"] }

[lints.rust]
missing_docs = "allow"
unsafe_code = "allow"

[lints.clippy]
all = "deny"
