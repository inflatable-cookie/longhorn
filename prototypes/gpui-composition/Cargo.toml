[package]
name = "longhorn-gpui-composition-example"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[[bin]]
name = "composition"
path = "src/main.rs"

[[bin]]
name = "drive"
path = "src/bin/drive.rs"

[dependencies]
core-graphics = "0.25.0"
gpui = "0.2.2"
longhorn-core = { path = "../../crates/longhorn-core" }
longhorn-notifications = { path = "../../crates/longhorn-notifications" }
longhorn-poodle = { path = "../../crates/longhorn-poodle" }
# The window binding itself is the neighbouring prototype's, not restated here.
# This example is about the *composition*; how a `GpuiWindowBackend` is written
# over `gpui::PlatformWindow` is that prototype's subject.
longhorn-gpui-windowing = { path = "../../crates/longhorn-gpui-windowing" }
longhorn-gpui-windowing-prototype = { path = "../gpui-windowing" }
longhorn-transfer = { path = "../../crates/longhorn-transfer" }
longhorn-config = { path = "../../crates/longhorn-config" }
longhorn-windowing = { path = "../../crates/longhorn-windowing" }
longhorn-windowing-config = { path = "../../crates/longhorn-windowing-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# By tag, matching `longhorn-poodle`. See the note in prototypes/gpui-windowing:
# reaching Poodle both directly and through `longhorn-poodle` needs one source,
# or the same struct arrives as two incompatible types.
poodle-adapter = { git = "https://github.com/inflatable-cookie/poodle.git", tag = "v0.2.2" }
poodle-gpui = { git = "https://github.com/inflatable-cookie/poodle.git", tag = "v0.2.2" }
poodle-gpui-node-backend = { git = "https://github.com/inflatable-cookie/poodle.git", tag = "v0.2.2" }
poodle-render = { git = "https://github.com/inflatable-cookie/poodle.git", tag = "v0.2.2" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
