[workspace]
members = ["adapter", "proof-app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
longhorn-core = { path = "../../crates/longhorn-core" }
longhorn-native-content-prototype = { path = "../native-content" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "=2.10.3", default-features = false, features = ["unstable", "wry"] }
tauri-build = { version = "=2.6.3", default-features = false, features = ["config-json"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
