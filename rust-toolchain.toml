# The stable toolchain Longhorn builds, tests and releases with.
#
# One declaration. rustup reads it locally; `ci.yml` and `release.yml` parse the
# channel and install exactly it, rather than floating `stable`. Rust 1.98 added
# `clippy::chunks_exact_to_as_chunks`, green on 1.97.1 locally and red on the
# runner, and stopped a dry run before publish. A new Clippy lint now reaches
# Longhorn only through a deliberate bump of this channel.
#
# The MSRV floor is separate and unchanged. It stays in
# release-baselines/rust-toolchains.env as LONGHORN_GENERAL_MSRV, and
# `effigy release:floor` exercises it through `rustup run`. Do not add the floor
# here and do not add this channel there.
#
# To bump: see "Toolchain pin" in docs/knowledge/contracts/release.md.
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]
